<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — PakBattle Esports</title>
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="header"></div>
<main class="section">
  <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem;">
    <div>
      <h1 class="section-title"><span class="neon-text">Welcome</span> <span class="gold-text">back</span></h1>
      <p class="muted" id="welcomeName" style="margin-top:.25rem;"></p>
    </div>
    <a href="admin.html" id="adminLink" class="btn-gold btn-sm" style="display:none;">Admin Panel</a>
  </div>

  <div class="dash-layout">
    <aside class="glass dash-side" id="tabRow">
      <button data-tab="profile" class="active">👤 Profile</button>
      <button data-tab="tournaments">🏆 My Tournaments</button>
      <button data-tab="history">🕓 Match History</button>
      <button data-tab="payments">💳 Payments</button>
      <button data-tab="notifications">🔔 Notifications</button>
      <button data-tab="settings">⚙️ Settings</button>
    </aside>
    <section class="glass dash-panel" id="panel">Loading...</section>
  </div>
</main>
<div id="footer"></div>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
